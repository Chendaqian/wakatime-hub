name: Update gist with WakaTime summary
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '单天补数据（格式 YYYY-MM-DD，优先于区间）'
        required: false
        default: ''
      start_date:
        description: '区间起始日期（格式 YYYY-MM-DD）'
        required: false
        default: ''
      end_date:
        description: '区间结束日期（格式 YYYY-MM-DD）'
        required: false
        default: ''
jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Update gist
        uses: ./sync
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_IDS: ${{ secrets.GIST_IDS || secrets.GIST_ID }}
          GIST_ID_2026: ${{ secrets.GIST_ID_2026 }}
          GIST_ID_2027: ${{ secrets.GIST_ID_2027 }}
          GIST_ID_2028: ${{ secrets.GIST_ID_2028 }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SCU_KEY: ${{ secrets.SCU_KEY }}
          SYNC_DATE: ${{ github.event.inputs.date }}
          SYNC_START: ${{ github.event.inputs.start_date }}
          SYNC_END: ${{ github.event.inputs.end_date }}
